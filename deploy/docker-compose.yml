services:
  redis:
    image: redis:7-alpine
    container_name: nexronda-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

  server:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: nexronda-server
    ports:
      - "8089:8080"
    environment:
      - PORT=8080
      - REDIS_URL=redis:6379
      - LIVEKIT_URL=${LIVEKIT_URL:-https://your-project.livekit.cloud}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-secretsecretsecretsecretsecretsecret32}
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis_data:
