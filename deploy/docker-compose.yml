services:
  redis:
    image: redis:7-alpine
    container_name: nexronda-redis
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:latest
    container_name: nexronda-livekit
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50050:50000-50050/udp"
    depends_on:
      - redis
    restart: unless-stopped

  server:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: nexronda-server
    ports:
      - "8089:8080"
    environment:
      - PORT=8080
      - REDIS_URL=redis:6379
      - LIVEKIT_URL=http://livekit:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secretsecretsecretsecretsecretsecret32
    depends_on:
      - redis
      - livekit
    restart: unless-stopped
