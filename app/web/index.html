<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="nexronda">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>NexRonda - Mesh Intercom</title>
  <link rel="manifest" href="manifest.json">

  <!-- Background Audio Loop & MediaSession Bridge for Mobile Browser/PWA -->
  <script>
    let backgroundAudioElement = null;

    function initBackgroundAudio() {
      if (backgroundAudioElement) return;
      // 1-second silent WAV base64 loop to maintain audio session & prevent browser background throttling
      const silentWavBase64 = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAP8A/w==";
      backgroundAudioElement = new Audio(silentWavBase64);
      backgroundAudioElement.loop = true;
      backgroundAudioElement.volume = 0.01;
    }

    window.enableBackgroundIntercom = function(roomName) {
      initBackgroundAudio();
      if (backgroundAudioElement) {
        backgroundAudioElement.play().catch(e => console.log('[NexRonda] Audio play hint:', e));
      }
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: 'NexRonda Convoy Intercom',
          artist: roomName || 'Active Ride',
          album: 'NexRonda Mesh',
          artwork: [{ src: 'icons/Icon-192.png', sizes: '192x192', type: 'image/png' }]
        });
        navigator.mediaSession.setActionHandler('play', () => {
          if (backgroundAudioElement) backgroundAudioElement.play();
        });
        navigator.mediaSession.setActionHandler('pause', () => {
          // Keep audio session alive or mute
        });
      }
    };

    window.disableBackgroundIntercom = function() {
      if (backgroundAudioElement) {
        backgroundAudioElement.pause();
      }
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = null;
      }
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
